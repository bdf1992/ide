<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Chat IDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--side:#181818;--line:#2b2b2b;--text:#ccc;--muted:#858585;--active:#37373d;--blue:#007acc}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 180px 22px}.side{grid-row:1/3;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead,.panelhead{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line)}.sidehead strong{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.side button,.panelhead button,.status button{border:0;background:transparent;cursor:pointer}.tree{padding:4px;overflow:auto}.file{padding:5px 7px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file:hover,.file.active{background:var(--active)}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.tabs{height:34px;display:flex;overflow:auto;background:var(--side);border-bottom:1px solid var(--line)}.tab{min-width:100px;max-width:220px;display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid var(--line);background:#252526;color:#aaa;cursor:pointer}.tab.active{background:var(--bg);color:white}.tab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;color:#999;cursor:pointer}.editor{position:relative;flex:1;min-height:0}.editorhost,.fallback{position:absolute;inset:0}.fallback{width:100%;height:100%;resize:none;border:0;outline:0;background:var(--bg);color:#d4d4d4;padding:12px;font:14px/1.5 Consolas,monospace}.panel{min-width:0;min-height:0;border-top:1px solid var(--line);display:flex;flex-direction:column}.panelhead button.active{color:white;border-bottom:1px solid white}.panelbody{flex:1;min-height:0;position:relative}.terminal,.agent{position:absolute;inset:0;padding:6px}.agent{display:grid;grid-template-columns:1fr 1fr;gap:8px}.agent section{min-width:0;display:flex;flex-direction:column}.agent textarea{flex:1;resize:none;background:#111;border:1px solid var(--line);padding:7px;font:11px/1.4 Consolas,monospace}.actions{display:flex;gap:6px;margin-top:6px}.actions button{border:1px solid #444;background:#2d2d30;padding:4px 8px;cursor:pointer}.hidden{display:none!important}.status{grid-column:1/3;background:var(--blue);display:flex;align-items:center;gap:12px;padding:0 8px;color:white;font-size:11px}.status .grow{flex:1}dialog{width:min(560px,calc(100% - 32px));border:1px solid #454545;background:#252526;color:var(--text);padding:0}dialog::backdrop{background:#0005}.quick input{width:100%;border:0;border-bottom:1px solid #454545;background:#1f1f1f;padding:10px 12px;outline:0}.quicklist{max-height:280px;overflow:auto}.quickitem{padding:8px 12px;cursor:pointer}.quickitem:hover,.quickitem.sel{background:#04395e;color:white}@media(max-width:700px){.app{grid-template-columns:160px minmax(0,1fr)}.agent{grid-template-columns:1fr}.agent section:first-child{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="sidehead"><strong>Explorer</strong><button id="quick" title="Quick Open (Ctrl+P)">⌕</button><button id="newFile" title="New file">＋</button></div>
    <div id="tree" class="tree"></div>
  </aside>
  <main class="main">
    <div id="tabs" class="tabs"></div>
    <div class="editor"><div id="editor" class="editorhost"></div><textarea id="fallback" class="fallback" spellcheck="false"></textarea></div>
  </main>
  <section class="panel">
    <div class="panelhead"><button id="termTab" class="active">Terminal</button><button id="agentTab">Agent</button><span style="flex:1"></span><button id="run">Run ▶</button></div>
    <div class="panelbody"><div id="terminal" class="terminal"></div><div id="agent" class="agent hidden"><section><strong>Context → ChatGPT</strong><textarea id="context" readonly></textarea><div class="actions"><button id="buildContext">Build context</button></div></section><section><strong>Patch ← ChatGPT</strong><textarea id="patch" placeholder="Paste IDE_PATCH/1 JSON"></textarea><div class="actions"><button id="previewPatch">Preview</button><button id="applyPatch">Apply</button></div></section></div></div>
  </section>
  <footer class="status"><span id="runtime">Python: loading…</span><span id="editorStatus">Editor: loading…</span><span id="cursor">Ln 1, Col 1</span><span id="rev">rev 0</span><span class="grow"></span><span>Hover = docs</span></footer>
</div>
<dialog id="palette"><div class="quick"><input id="qinput" placeholder="Search files by name…"><div id="qlist" class="quicklist"></div></div></dialog>
<script id="seam">
window.IdeSeam=(function(){
function buildStatePacket(services){return{protocol:'IDE_STATE_PACKET/1',workspace_revision:services.workspace.revision,active_file:services.editor.active_file,open_tabs:[...services.editor.open_tabs],selection:services.editor.selection||'',files:{...services.workspace.files},terminal:services.terminal.lines||'',canonical_repo:services.workspace.canonical_repo,request:'Act as the IDE over this exact workspace. Prefer ordinary IDE primitives and the smallest explainable change.'}}
function applyPatch(services,patch){if(patch.protocol!=='IDE_PATCH/1'||!Array.isArray(patch.changes))throw Error('Expected IDE_PATCH/1 with changes[]');if(patch.base_revision!=null&&String(patch.base_revision)!==String(services.workspace.revision))throw Error(`Stale patch: expected revision ${patch.base_revision}, current revision ${services.workspace.revision}`);for(const c of patch.changes)if(typeof c.path!=='string'||typeof c.content!=='string')throw Error('Each change needs path and content');for(const c of patch.changes)services.write(c.path,c.content);services.bumpRevision();return patch}
return{buildStatePacket,applyPatch}
})();
</script>
<script>
const KEY='open-chat-ide-v03';
const defaults={'main.py':'values = [4, 7, 2]\ntotal = 0\n\nfor value in values:\n    total += value\n\nprint(total)\n','model.py':'x = [2.0, -1.0, 3.0]\nw = [0.5, 0.25, -0.75]\nb = 0.1\ny = sum(a*b for a,b in zip(x,w)) + b\nprint(y)\n','README.md':'# Workspace\n\nUse Ctrl+P to open files, Ctrl+S to save, Ctrl+Enter to run Python.\n'};
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!state||!state.files)state={files:{...defaults},active:'main.py',tabs:['main.py'],rev:0};state.tabs=(state.tabs||[]).filter(x=>state.files[x]!=null);if(!state.tabs.length)state.tabs=[state.active||Object.keys(state.files)[0]];let active=state.files[state.active]!=null?state.active:state.tabs[0];if(!state.tabs.includes(active))state.tabs.push(active);
let monacoEditor=null,term=null,pyodide=null,pending=null,models=new Map(),terminalText='';const $=s=>document.querySelector(s);
function persist(bump=false){if(bump)state.rev=(state.rev||0)+1;state.active=active;localStorage.setItem(KEY,JSON.stringify(state));$('#rev').textContent='rev '+state.rev}
function getValue(){return monacoEditor?monacoEditor.getValue():$('#fallback').value}
function save(bump=true){if(active)state.files[active]=getValue();persist(bump)}
function lang(path){if(path.endsWith('.py'))return'python';if(path.endsWith('.md'))return'markdown';if(path.endsWith('.json'))return'json';if(path.endsWith('.js'))return'javascript';if(path.endsWith('.ts'))return'typescript';if(path.endsWith('.html'))return'html';if(path.endsWith('.css'))return'css';return'plaintext'}
function model(path){if(!monacoEditor||!window.monaco)return null;if(models.has(path))return models.get(path);const m=monaco.editor.createModel(state.files[path]||'',lang(path),monaco.Uri.parse('inmemory://workspace/'+encodeURIComponent(path)));models.set(path,m);return m}
function render(){const tree=$('#tree');tree.innerHTML='';Object.keys(state.files).sort().forEach(name=>{const d=document.createElement('div');d.className='file'+(name===active?' active':'');d.textContent=name;d.title=name;d.onclick=()=>open(name);tree.appendChild(d)});const tabs=$('#tabs');tabs.innerHTML='';state.tabs.forEach(name=>{if(state.files[name]==null)return;const t=document.createElement('div');t.className='tab'+(name===active?' active':'');const label=document.createElement('span');label.textContent=name;label.onclick=()=>open(name);const close=document.createElement('button');close.textContent='×';close.onclick=e=>{e.stopPropagation();closeTab(name)};t.append(label,close);tabs.appendChild(t)});persist(false)}
function open(name){if(state.files[name]==null)return;save(false);active=name;if(!state.tabs.includes(name))state.tabs.push(name);if(monacoEditor)monacoEditor.setModel(model(name));else $('#fallback').value=state.files[name];render();cursor()}
function closeTab(name){save(false);const i=state.tabs.indexOf(name);if(i<0)return;state.tabs.splice(i,1);if(!state.tabs.length)state.tabs.push(Object.keys(state.files)[0]);if(active===name){active=state.tabs[Math.min(i,state.tabs.length-1)];open(active)}else render()}
function newFile(){let name=prompt('File name','untitled.py');if(!name)return;name=name.trim();if(!name)return;if(state.files[name]==null)state.files[name]='';open(name);save()}
function cursor(){if(!monacoEditor)return;const p=monacoEditor.getPosition();if(p)$('#cursor').textContent=`Ln ${p.lineNumber}, Col ${p.column}`}
$('#fallback').value=state.files[active];$('#fallback').addEventListener('input',()=>save());$('#newFile').onclick=newFile;render();
function show(which){const agent=which==='agent';$('#agent').classList.toggle('hidden',!agent);$('#terminal').classList.toggle('hidden',agent);$('#agentTab').classList.toggle('active',agent);$('#termTab').classList.toggle('active',!agent)}$('#agentTab').onclick=()=>show('agent');$('#termTab').onclick=()=>show('term');
function out(text){terminalText+=text;if(term)term.write(text.replace(/\n/g,'\r\n'));else $('#terminal').textContent=terminalText}
async function runPython(){save(false);show('term');if(!active.endsWith('.py'))return out('\nOnly .py files run in the chat core.\n');if(!pyodide)return out('\nPython is still loading or unavailable.\n');out(`\n$ python ${active}\n`);pyodide.globals.set('__src__',state.files[active]);try{const r=await pyodide.runPythonAsync("import io,contextlib,traceback\nb=io.StringIO(); n={}\ntry:\n    with contextlib.redirect_stdout(b),contextlib.redirect_stderr(b): exec(compile(__src__,'<workspace>','exec'),n,n)\nexcept Exception: traceback.print_exc(file=b)\nb.getvalue()");out(String(r)||'')}catch(e){out(String(e)+'\n')}finally{try{pyodide.globals.delete('__src__')}catch{}}}
$('#run').onclick=runPython;
async function shell(cmd){if(cmd==='help')return out('help  ls  cat FILE  clear  python FILE\n');if(cmd==='ls')return out(Object.keys(state.files).sort().join('  ')+'\n');if(cmd==='clear'){terminalText='';if(term)term.clear();else $('#terminal').textContent='';return}if(cmd.startsWith('cat '))return out((state.files[cmd.slice(4).trim()]??'file not found')+'\n');if(cmd.startsWith('python ')){const n=cmd.slice(7).trim();if(state.files[n]==null)return out('file not found\n');const before=active;open(n);await runPython();open(before);return}out('command not found\n')}
function buildContext(){save(false);const selection=monacoEditor?monacoEditor.getModel().getValueInRange(monacoEditor.getSelection()):'';const services={workspace:{revision:state.rev,files:state.files,canonical_repo:'https://github.com/bdf1992/ide'},editor:{active_file:active,open_tabs:state.tabs,selection},terminal:{lines:terminalText}};$('#context').value=JSON.stringify(IdeSeam.buildStatePacket(services),null,2);show('agent')}$('#buildContext').onclick=buildContext;
$('#previewPatch').onclick=()=>{pending=null;try{const p=JSON.parse($('#patch').value);IdeSeam.applyPatch({workspace:{revision:state.rev},write(){},bumpRevision(){}},p);pending=p;alert((p.note?p.note+'\n\n':'')+p.changes.map(c=>c.path).join('\n'))}catch(e){alert('Patch rejected: '+e.message)}};
$('#applyPatch').onclick=()=>{if(!pending){$('#previewPatch').click();if(!pending)return}save(false);const p=pending;IdeSeam.applyPatch({workspace:{revision:state.rev,files:state.files},write(path,content){state.files[path]=content;if(models.has(path))models.get(path).setValue(content)},bumpRevision(){state.rev+=1}},p);persist(false);if(p.changes.some(c=>c.path===active))open(active);render();out('\n[agent] patch applied\n');pending=null};
const docs={for:'Iterate over each item from an iterable and execute the indented block once per item.',while:'Repeat a block while its condition remains truthy.',if:'Execute a block when its condition is truthy.',def:'Create a function and bind it to a name. Parameters form its input boundary.',return:'Leave the current function and optionally send a value to the caller.',class:'Create a reusable class namespace and construction rule.',import:'Load a module and bind a name to it.'};const builtins=['print','len','range','sum','zip','enumerate','list','dict','set','tuple','str','int','float','bool','min','max','abs','sorted','map','filter','any','all','type','isinstance','round','input'];
(function loadMonaco(){window.MonacoEnvironment={getWorkerUrl(){const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/';return URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}'};importScripts('${base}vs/base/worker/workerMain.js');`],{type:'text/javascript'}))}};const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js';s.onload=()=>{require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs'}});require(['vs/editor/editor.main'],()=>{monacoEditor=monaco.editor.create($('#editor'),{model:monaco.editor.createModel(state.files[active],lang(active),monaco.Uri.parse('inmemory://workspace/'+encodeURIComponent(active))),theme:'vs-dark',automaticLayout:true,minimap:{enabled:false},fontSize:14,scrollBeyondLastLine:false,hover:{enabled:true,delay:250},quickSuggestions:true});models.set(active,monacoEditor.getModel());$('#fallback').classList.add('hidden');$('#editorStatus').textContent='Editor: Monaco';monacoEditor.onDidChangeModelContent(()=>save());monacoEditor.onDidChangeCursorPosition(cursor);monaco.languages.registerHoverProvider('python',{provideHover:(m,p)=>{const w=m.getWordAtPosition(p);if(!w||!docs[w.word])return null;return{range:new monaco.Range(p.lineNumber,w.startColumn,p.lineNumber,w.endColumn),contents:[{value:'**'+w.word+'**'},{value:docs[w.word]}]}}});monaco.languages.registerCompletionItemProvider('python',{provideCompletionItems:()=>({suggestions:builtins.map(x=>({label:x,kind:monaco.languages.CompletionItemKind.Function,insertText:x,detail:'Python built-in'}))})});cursor()})};s.onerror=()=>$('#editorStatus').textContent='Editor: fallback';document.head.appendChild(s)})();
(async()=>{try{const m=await import('https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs');pyodide=await m.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/'});$('#runtime').textContent='Python: CPython 3.14';out('[python] Pyodide ready\n')}catch(e){$('#runtime').textContent='Python: unavailable';out('[python] preview blocked Pyodide\n')}})();
(async()=>{try{const m=await import('https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm');term=new m.Terminal({theme:{background:'#181818',foreground:'#ccc'},fontFamily:'Consolas,monospace',fontSize:12,cursorBlink:true});term.open($('#terminal'));term.write('Open Chat IDE\r\nType help for commands.\r\n> ');let line='';term.onData(async d=>{if(d==='\r'){term.write('\r\n');const c=line.trim();line='';await shell(c);term.write('> ')}else if(d==='\u007F'){if(line){line=line.slice(0,-1);term.write('\b \b')}}else if(d>=' '){line+=d;term.write(d)}})}catch(e){out('xterm.js unavailable; terminal output fallback active.\n')}})();
const palette=$('#palette'),qinput=$('#qinput'),qlist=$('#qlist');let qitems=[],qi=0;function qr(){const q=qinput.value.toLowerCase();qitems=Object.keys(state.files).filter(x=>x.toLowerCase().includes(q)).sort();qi=Math.min(qi,Math.max(0,qitems.length-1));qlist.innerHTML='';qitems.forEach((n,i)=>{const d=document.createElement('div');d.className='quickitem'+(i===qi?' sel':'');d.textContent=n;d.onclick=()=>{open(n);palette.close()};qlist.appendChild(d)})}function qo(){qi=0;qinput.value='';qr();palette.showModal();setTimeout(()=>qinput.focus())}$('#quick').onclick=qo;qinput.oninput=()=>{qi=0;qr()};qinput.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();qi=Math.min(qi+1,qitems.length-1);qr()}else if(e.key==='ArrowUp'){e.preventDefault();qi=Math.max(0,qi-1);qr()}else if(e.key==='Enter'&&qitems[qi]){e.preventDefault();open(qitems[qi]);palette.close()}else if(e.key==='Escape')palette.close()};
window.addEventListener('keydown',e=>{const c=e.ctrlKey||e.metaKey;if(c&&e.key.toLowerCase()==='p'){e.preventDefault();qo()}else if(c&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(c&&e.key==='Enter'){e.preventDefault();runPython()}});
</script>
</body>
</html>
