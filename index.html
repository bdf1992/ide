<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Chat IDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--side:#181818;--line:#2b2b2b;--text:#ccc;--muted:#858585;--active:#37373d;--blue:#007acc;--focus:#75beff;--danger:#f48771}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit;color:inherit}button:focus-visible,.file:focus-visible,.tab:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 210px 22px}.side{grid-row:1/3;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead,.panelhead{height:34px;display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid var(--line)}.sidehead strong{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.side button,.panelhead button,.status button{border:0;background:transparent;cursor:pointer;border-radius:3px}.side button:hover,.panelhead button:hover{background:var(--active);color:white}.tree{padding:4px;overflow:auto}.file{padding:5px 7px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file:hover,.file.active{background:var(--active)}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.tabs{height:34px;display:flex;overflow:auto;background:var(--side);border-bottom:1px solid var(--line)}.tab{min-width:100px;max-width:220px;display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid var(--line);background:#252526;color:#aaa;cursor:pointer}.tab.active{background:var(--bg);color:white}.tab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;color:#999;cursor:pointer}.editor{position:relative;flex:1;min-height:0}.editorhost,.fallback{position:absolute;inset:0}.fallback{width:100%;height:100%;resize:none;border:0;outline:0;background:var(--bg);color:#d4d4d4;padding:12px;font:14px/1.5 Consolas,monospace}.panel{min-width:0;min-height:0;border-top:1px solid var(--line);display:flex;flex-direction:column}.panelhead button.active{color:white;border-bottom:1px solid white}.panelbody{flex:1;min-height:0;position:relative}.terminal,.agent{position:absolute;inset:0;padding:6px}.agent{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.agent section{min-width:0;display:flex;flex-direction:column}.agent strong{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#aaa;margin-bottom:4px}.agent textarea{flex:1;resize:none;background:#111;border:1px solid var(--line);border-radius:3px;padding:7px;font:11px/1.4 Consolas,monospace}.actions{display:flex;gap:6px;margin-top:6px;align-items:center}.actions button{border:1px solid #444;background:#2d2d30;padding:4px 8px;cursor:pointer;border-radius:3px}.actions button:hover{border-color:#777;background:#37373d}.hint{color:var(--muted);font-size:10px;margin-left:auto}.hidden{display:none!important}.status{grid-column:1/3;background:var(--blue);display:flex;align-items:center;gap:12px;padding:0 8px;color:white;font-size:11px}.status .grow{flex:1}.status button{padding:0;color:white}.status .offline{opacity:.72}.status .online::before{content:'●';color:#89d185;margin-right:4px}.status .error::before{content:'●';color:#f48771;margin-right:4px}dialog{width:min(560px,calc(100% - 32px));border:1px solid #454545;background:#252526;color:var(--text);padding:0}dialog::backdrop{background:#0008}.quick input{width:100%;border:0;border-bottom:1px solid #454545;background:#1f1f1f;padding:10px 12px;outline:0}.quicklist{max-height:280px;overflow:auto}.quickitem{padding:8px 12px;cursor:pointer}.quickitem:hover,.quickitem.sel{background:#04395e;color:white}@media(max-width:900px){.agent{grid-template-columns:1fr 1fr}.agent section:first-child{display:none}}@media(max-width:700px){.app{grid-template-columns:165px minmax(0,1fr)}.agent{grid-template-columns:1fr}.agent section:nth-child(2){display:none}.status span:nth-child(n+4):not(.grow),.status button{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="sidehead"><strong>Explorer</strong><button id="quick" title="Quick Open (Ctrl+P)" aria-label="Quick open">⌕</button><button id="newFile" title="New file" aria-label="New file">＋</button><button id="renameFile" title="Rename active file" aria-label="Rename active file">✎</button><button id="deleteFile" title="Delete active file" aria-label="Delete active file">⌫</button><button id="importWorkspace" title="Import workspace" aria-label="Import workspace">⇩</button><button id="exportWorkspace" title="Export workspace" aria-label="Export workspace">⇧</button><input id="workspaceFile" type="file" accept="application/json,.json" hidden></div>
    <div id="tree" class="tree"></div>
  </aside>
  <main class="main">
    <div id="tabs" class="tabs"></div>
    <div class="editor"><div id="editor" class="editorhost"></div><textarea id="fallback" class="fallback" spellcheck="false"></textarea></div>
  </main>
  <section class="panel">
    <div class="panelhead"><button id="termTab" class="active">Terminal</button><button id="agentTab">Agent</button><span style="flex:1"></span><button id="run">Run ▶</button></div>
    <div class="panelbody"><div id="terminal" class="terminal"></div><div id="agent" class="agent hidden"><section><strong>Context → ChatGPT</strong><textarea id="context" readonly></textarea><div class="actions"><button id="buildContext">Build context</button><button id="copyContext">Copy</button></div></section><section><strong>Patch ← ChatGPT</strong><textarea id="patch" placeholder="Paste IDE_PATCH/1 JSON"></textarea><div class="actions"><button id="previewPatch">Preview</button><button id="applyPatch">Apply</button></div></section><section><strong>Local model → Candidate</strong><textarea id="proposal" readonly placeholder="Connect the optional local bridge to request a semantic candidate."></textarea><div class="actions"><button id="propose">Propose active file</button><span class="hint">No admission</span></div></section></div></div>
  </section>
  <footer class="status"><span id="runtime">Python: loading…</span><span id="editorStatus">Editor: loading…</span><span id="cursor">Ln 1, Col 1</span><span id="rev">rev 0</span><span class="grow"></span><button id="localStatus" class="offline" title="Check optional localhost bridge">Local: checking…</button><span>Hover = docs</span></footer>
</div>
<dialog id="palette"><div class="quick"><input id="qinput" placeholder="Search files by name…"><div id="qlist" class="quicklist"></div></div></dialog>
<script>
const KEY='open-chat-ide-v03',WORKSPACE_PROTOCOL='IDE_WORKSPACE/1';
const defaults={'main.py':'values = [4, 7, 2]\ntotal = 0\n\nfor value in values:\n    total += value\n\nprint(total)\n','model.py':'x = [2.0, -1.0, 3.0]\nw = [0.5, 0.25, -0.75]\nb = 0.1\ny = sum(a*b for a,b in zip(x,w)) + b\nprint(y)\n','README.md':'# Workspace\n\nUse Ctrl+P to open files, Ctrl+S to save, Ctrl+Enter to run Python.\n'};
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!state||!state.files)state={files:{...defaults},active:'main.py',tabs:['main.py'],rev:0};state.tabs=(state.tabs||[]).filter(x=>state.files[x]!=null);if(!state.tabs.length)state.tabs=[state.active||Object.keys(state.files)[0]];let active=state.files[state.active]!=null?state.active:state.tabs[0];if(!state.tabs.includes(active))state.tabs.push(active);
let monacoEditor=null,term=null,pyodide=null,pending=null,models=new Map(),terminalText='',localBridge=false,localModel=null;const $=s=>document.querySelector(s);
function persist(bump=false){if(bump)state.rev=(state.rev||0)+1;state.active=active;localStorage.setItem(KEY,JSON.stringify(state));$('#rev').textContent='rev '+state.rev}
function getValue(){return monacoEditor?monacoEditor.getValue():$('#fallback').value}
function save(bump=true){if(active)state.files[active]=getValue();persist(bump)}
function lang(path){if(path.endsWith('.py'))return'python';if(path.endsWith('.md'))return'markdown';if(path.endsWith('.json'))return'json';if(path.endsWith('.js'))return'javascript';if(path.endsWith('.ts'))return'typescript';if(path.endsWith('.html'))return'html';if(path.endsWith('.css'))return'css';return'plaintext'}
function model(path){if(!monacoEditor||!window.monaco)return null;if(models.has(path))return models.get(path);const m=monaco.editor.createModel(state.files[path]||'',lang(path),monaco.Uri.parse('inmemory://workspace/'+encodeURIComponent(path)));models.set(path,m);return m}
function render(){const tree=$('#tree');tree.innerHTML='';Object.keys(state.files).sort().forEach(name=>{const d=document.createElement('div');d.className='file'+(name===active?' active':'');d.textContent=name;d.title=name;d.tabIndex=0;d.setAttribute('role','button');d.onclick=()=>open(name);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(name)}};tree.appendChild(d)});const tabs=$('#tabs');tabs.innerHTML='';state.tabs.forEach(name=>{if(state.files[name]==null)return;const t=document.createElement('div');t.className='tab'+(name===active?' active':'');const label=document.createElement('span');label.textContent=name;label.onclick=()=>open(name);const close=document.createElement('button');close.textContent='×';close.title='Close '+name;close.setAttribute('aria-label','Close '+name);close.onclick=e=>{e.stopPropagation();closeTab(name)};t.append(label,close);tabs.appendChild(t)});persist(false)}
function open(name){if(state.files[name]==null)return;save(false);active=name;if(!state.tabs.includes(name))state.tabs.push(name);if(monacoEditor)monacoEditor.setModel(model(name));else $('#fallback').value=state.files[name];render();cursor()}
function closeTab(name){save(false);const i=state.tabs.indexOf(name);if(i<0)return;state.tabs.splice(i,1);if(!state.tabs.length)state.tabs.push(Object.keys(state.files)[0]);if(active===name){active=state.tabs[Math.min(i,state.tabs.length-1)];open(active)}else render()}
function validPath(name){return typeof name==='string'&&name.length>0&&name.length<=240&&!name.startsWith('/')&&!name.includes('\\')&&!name.split('/').some(part=>!part||part==='.'||part==='..')}
function disposeModel(name){if(models.has(name)){models.get(name).dispose();models.delete(name)}}
function setActiveEditor(){if(monacoEditor)monacoEditor.setModel(model(active));else $('#fallback').value=state.files[active]||'';render();cursor()}
function newFile(){let name=prompt('File name','untitled.py');if(name==null)return;name=name.trim();if(!validPath(name))return alert('Use a relative workspace path without empty, . or .. segments.');if(state.files[name]!=null)return alert('That file already exists.');save(false);state.files[name]='';active=name;if(!state.tabs.includes(name))state.tabs.push(name);persist(true);setActiveEditor()}
function renameFile(){save(false);const before=active;let name=prompt('Rename active file',before);if(name==null)return;name=name.trim();if(name===before)return;if(!validPath(name))return alert('Use a relative workspace path without empty, . or .. segments.');if(state.files[name]!=null)return alert('That file already exists.');const content=state.files[before];delete state.files[before];state.files[name]=content;state.tabs=state.tabs.map(path=>path===before?name:path);disposeModel(before);active=name;persist(true);setActiveEditor();out(`\n[workspace] renamed ${before} → ${name}\n`)}
function deleteFile(){save(false);const doomed=active;if(!confirm(`Delete ${doomed} from this browser workspace? Export first if you need a backup.`))return;delete state.files[doomed];disposeModel(doomed);state.tabs=state.tabs.filter(path=>path!==doomed);if(!Object.keys(state.files).length)state.files['untitled.py']='';active=state.tabs.find(path=>state.files[path]!=null)||Object.keys(state.files).sort()[0];if(!state.tabs.includes(active))state.tabs.push(active);persist(true);setActiveEditor();out(`\n[workspace] deleted ${doomed}\n`)}
function workspacePacket(){save(false);return{protocol:WORKSPACE_PROTOCOL,workspace_revision:state.rev,exported_at:new Date().toISOString(),active_file:active,open_tabs:[...state.tabs],files:{...state.files}}}
function exportWorkspace(){const blob=new Blob([JSON.stringify(workspacePacket(),null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`open-chat-workspace-rev-${state.rev}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),0);out('\n[workspace] exported portable snapshot\n')}
function validateWorkspace(packet){if(!packet||packet.protocol!==WORKSPACE_PROTOCOL||!packet.files||Array.isArray(packet.files)||typeof packet.files!=='object')throw Error(`Expected ${WORKSPACE_PROTOCOL} with files`);const entries=Object.entries(packet.files);if(!entries.length)throw Error('Workspace must contain at least one file');for(const [path,content] of entries)if(!validPath(path)||typeof content!=='string')throw Error('Every file needs a safe relative path and string content');return Object.fromEntries(entries)}
async function importWorkspace(file){let packet;try{packet=JSON.parse(await file.text());const files=validateWorkspace(packet);if(!confirm(`Replace this browser workspace with ${Object.keys(files).length} imported file(s)?`))return;save(false);for(const name of [...models.keys()])disposeModel(name);const importedRev=Number.isFinite(Number(packet.workspace_revision))?Number(packet.workspace_revision):0;state={files,active:files[packet.active_file]!=null?packet.active_file:Object.keys(files).sort()[0],tabs:Array.isArray(packet.open_tabs)?packet.open_tabs.filter(path=>files[path]!=null):[],rev:Math.max(state.rev||0,importedRev)+1};active=state.active;if(!state.tabs.length)state.tabs=[active];if(!state.tabs.includes(active))state.tabs.push(active);pending=null;persist(false);setActiveEditor();out('\n[workspace] imported portable snapshot\n')}catch(e){alert('Workspace import rejected: '+e.message)}finally{$('#workspaceFile').value=''}}
function cursor(){if(!monacoEditor)return;const p=monacoEditor.getPosition();if(p)$('#cursor').textContent=`Ln ${p.lineNumber}, Col ${p.column}`}
$('#fallback').value=state.files[active];$('#fallback').addEventListener('input',()=>save());$('#newFile').onclick=newFile;$('#renameFile').onclick=renameFile;$('#deleteFile').onclick=deleteFile;$('#exportWorkspace').onclick=exportWorkspace;$('#importWorkspace').onclick=()=>$('#workspaceFile').click();$('#workspaceFile').onchange=e=>{if(e.target.files[0])importWorkspace(e.target.files[0])};render();
function show(which){const agent=which==='agent';$('#agent').classList.toggle('hidden',!agent);$('#terminal').classList.toggle('hidden',agent);$('#agentTab').classList.toggle('active',agent);$('#termTab').classList.toggle('active',!agent)}$('#agentTab').onclick=()=>show('agent');$('#termTab').onclick=()=>show('term');
function out(text){terminalText+=text;if(term)term.write(text.replace(/\n/g,'\r\n'));else $('#terminal').textContent=terminalText}
async function runPython(){save(false);show('term');if(!active.endsWith('.py'))return out('\nOnly .py files run in the chat core.\n');if(!pyodide)return out('\nPython is still loading or unavailable.\n');out(`\n$ python ${active}\n`);pyodide.globals.set('__src__',state.files[active]);try{const r=await pyodide.runPythonAsync("import io,contextlib,traceback\nb=io.StringIO(); n={}\ntry:\n    with contextlib.redirect_stdout(b),contextlib.redirect_stderr(b): exec(compile(__src__,'<workspace>','exec'),n,n)\nexcept Exception: traceback.print_exc(file=b)\nb.getvalue()");out(String(r)||'')}catch(e){out(String(e)+'\n')}finally{try{pyodide.globals.delete('__src__')}catch{}}}
$('#run').onclick=runPython;
async function shell(cmd){if(cmd==='help')return out('help  ls  cat FILE  clear  python FILE  bridge  propose FILE\n');if(cmd==='ls')return out(Object.keys(state.files).sort().join('  ')+'\n');if(cmd==='clear'){terminalText='';if(term)term.clear();else $('#terminal').textContent='';return}if(cmd==='bridge'){await checkLocal();return out(localBridge?`Local bridge ready${localModel?' · '+localModel:''}\n`:'Local bridge unavailable\n')}if(cmd.startsWith('cat '))return out((state.files[cmd.slice(4).trim()]??'file not found')+'\n');if(cmd.startsWith('python ')){const n=cmd.slice(7).trim();if(state.files[n]==null)return out('file not found\n');const before=active;open(n);await runPython();open(before);return}if(cmd.startsWith('propose ')){const n=cmd.slice(8).trim();if(state.files[n]==null)return out('file not found\n');await proposeFile(n);return}out('command not found\n')}
function buildContext(){save(false);const selection=monacoEditor?monacoEditor.getModel().getValueInRange(monacoEditor.getSelection()):'';$('#context').value=JSON.stringify({protocol:'IDE_STATE_PACKET/1',workspace_revision:state.rev,active_file:active,open_tabs:[...state.tabs],selection,files:{...state.files},terminal:terminalText,canonical_repo:'https://github.com/bdf1992/ide',request:'Act as the IDE over this exact workspace. Prefer ordinary IDE primitives and the smallest explainable change.'},null,2);show('agent')}$('#buildContext').onclick=buildContext;$('#copyContext').onclick=async()=>{if(!$('#context').value)buildContext();try{await navigator.clipboard.writeText($('#context').value);out('\n[agent] context copied\n')}catch{alert('Clipboard access is unavailable. Select and copy the context manually.')}};
$('#previewPatch').onclick=()=>{pending=null;try{const p=JSON.parse($('#patch').value);if(p.protocol!=='IDE_PATCH/1'||!Array.isArray(p.changes))throw Error('Expected IDE_PATCH/1 with changes[]');if(p.base_revision!=null&&String(p.base_revision)!==String(state.rev))throw Error(`Stale patch: expected revision ${p.base_revision}, current revision ${state.rev}`);for(const c of p.changes)if(typeof c.path!=='string'||typeof c.content!=='string')throw Error('Each change needs path and content');pending=p;alert((p.note?p.note+'\n\n':'')+p.changes.map(c=>c.path).join('\n'))}catch(e){alert('Patch rejected: '+e.message)}};
$('#applyPatch').onclick=()=>{if(!pending){$('#previewPatch').click();if(!pending)return}save(false);for(const c of pending.changes){state.files[c.path]=c.content;if(models.has(c.path))models.get(c.path).setValue(c.content)}persist(true);if(pending.changes.some(c=>c.path===active))open(active);render();out('\n[agent] patch applied\n');pending=null};
async function responseJSON(response){let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(body.error?.detail||`HTTP ${response.status}`);return body}
async function checkLocal(){const status=$('#localStatus');status.textContent='Local: checking…';status.className='offline';localBridge=false;localModel=null;try{const bridge=await fetch('/api/health',{cache:'no-store'}).then(responseJSON);if(bridge.protocol!=='LOCAL_IDE_BRIDGE/1')throw Error('Unexpected bridge protocol');localBridge=true;try{const model=await fetch('/api/model/health',{cache:'no-store'}).then(responseJSON);localModel=model.model||null;status.textContent='Local: '+(localModel||'model ready');status.className='online';status.title='Local bridge and model are reachable'}catch(e){status.textContent='Local: model offline';status.className='error';status.title=e.message}}catch(e){status.textContent='Local: disconnected';status.className='offline';status.title='Optional localhost bridge is not active'}}
async function proposeFile(path){show('agent');save(false);const target=$('#proposal');target.value=`Requesting an untrusted candidate for ${path}…`;if(!localBridge)await checkLocal();if(!localBridge){target.value='Local bridge unavailable. Start python local/server.py, then retry.';return}try{const result=await fetch('/api/model/propose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:`rev-${state.rev}:${path}`,projection:lang(path),source:state.files[path]})}).then(responseJSON);if(result.protocol!=='LOCAL_MODEL_RESULT/1'||result.authority!=='candidate-only')throw Error('Unexpected model result contract');target.value=JSON.stringify(result,null,2);out(`\n[model] candidate returned for ${path}; no admission or patch applied\n`)}catch(e){target.value='Proposal failed: '+e.message;out(`\n[model] proposal failed: ${e.message}\n`);await checkLocal()}}
$('#propose').onclick=()=>proposeFile(active);$('#localStatus').onclick=checkLocal;checkLocal();
const docs={for:'Iterate over each item from an iterable and execute the indented block once per item.',while:'Repeat a block while its condition remains truthy.',if:'Execute a block when its condition is truthy.',def:'Create a function and bind it to a name. Parameters form its input boundary.',return:'Leave the current function and optionally send a value to the caller.',class:'Create a reusable class namespace and construction rule.',import:'Load a module and bind a name to it.'};const builtins=['print','len','range','sum','zip','enumerate','list','dict','set','tuple','str','int','float','bool','min','max','abs','sorted','map','filter','any','all','type','isinstance','round','input'];
(function loadMonaco(){window.MonacoEnvironment={getWorkerUrl(){const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/';return URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}'};importScripts('${base}vs/base/worker/workerMain.js');`],{type:'text/javascript'}))}};const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js';s.onload=()=>{require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs'}});require(['vs/editor/editor.main'],()=>{monacoEditor=monaco.editor.create($('#editor'),{model:monaco.editor.createModel(state.files[active],lang(active),monaco.Uri.parse('inmemory://workspace/'+encodeURIComponent(active))),theme:'vs-dark',automaticLayout:true,minimap:{enabled:false},fontSize:14,scrollBeyondLastLine:false,hover:{enabled:true,delay:250},quickSuggestions:true});models.set(active,monacoEditor.getModel());$('#fallback').classList.add('hidden');$('#editorStatus').textContent='Editor: Monaco';monacoEditor.onDidChangeModelContent(()=>save());monacoEditor.onDidChangeCursorPosition(cursor);monaco.languages.registerHoverProvider('python',{provideHover:(m,p)=>{const w=m.getWordAtPosition(p);if(!w||!docs[w.word])return null;return{range:new monaco.Range(p.lineNumber,w.startColumn,p.lineNumber,w.endColumn),contents:[{value:'**'+w.word+'**'},{value:docs[w.word]}]}}});monaco.languages.registerCompletionItemProvider('python',{provideCompletionItems:()=>({suggestions:builtins.map(x=>({label:x,kind:monaco.languages.CompletionItemKind.Function,insertText:x,detail:'Python built-in'}))})});cursor()})};s.onerror=()=>$('#editorStatus').textContent='Editor: fallback';document.head.appendChild(s)})();
(async()=>{try{const m=await import('https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs');pyodide=await m.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/'});$('#runtime').textContent='Python: CPython 3.14';out('[python] Pyodide ready\n')}catch(e){$('#runtime').textContent='Python: unavailable';out('[python] preview blocked Pyodide\n')}})();
(async()=>{try{const m=await import('https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm');term=new m.Terminal({theme:{background:'#181818',foreground:'#ccc'},fontFamily:'Consolas,monospace',fontSize:12,cursorBlink:true});term.open($('#terminal'));term.write('Open Chat IDE\r\nType help for commands.\r\n> ');let line='';term.onData(async d=>{if(d==='\r'){term.write('\r\n');const c=line.trim();line='';await shell(c);term.write('> ')}else if(d==='\u007F'){if(line){line=line.slice(0,-1);term.write('\b \b')}}else if(d>=' '){line+=d;term.write(d)}})}catch(e){out('xterm.js unavailable; terminal output fallback active.\n')}})();
const palette=$('#palette'),qinput=$('#qinput'),qlist=$('#qlist');let qitems=[],qi=0;function qr(){const q=qinput.value.toLowerCase();qitems=Object.keys(state.files).filter(x=>x.toLowerCase().includes(q)).sort();qi=Math.min(qi,Math.max(0,qitems.length-1));qlist.innerHTML='';qitems.forEach((n,i)=>{const d=document.createElement('div');d.className='quickitem'+(i===qi?' sel':'');d.textContent=n;d.onclick=()=>{open(n);palette.close()};qlist.appendChild(d)})}function qo(){qi=0;qinput.value='';qr();palette.showModal();setTimeout(()=>qinput.focus())}$('#quick').onclick=qo;qinput.oninput=()=>{qi=0;qr()};qinput.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();qi=Math.min(qi+1,qitems.length-1);qr()}else if(e.key==='ArrowUp'){e.preventDefault();qi=Math.max(0,qi-1);qr()}else if(e.key==='Enter'&&qitems[qi]){e.preventDefault();open(qitems[qi]);palette.close()}else if(e.key==='Escape')palette.close()};
window.addEventListener('keydown',e=>{const c=e.ctrlKey||e.metaKey;if(c&&e.key.toLowerCase()==='p'){e.preventDefault();qo()}else if(c&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(c&&e.key==='Enter'){e.preventDefault();runPython()}});
</script>
</body>
</html>
