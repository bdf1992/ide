<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Projection POC 0.1</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--panel:#181818;--line:#303030;--text:#d4d4d4;--muted:#8c8c8c;--ok:#4ec9b0;--bad:#f48771;--warn:#dcdcaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif}.top{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.grow{flex:1}.standing{font:12px Consolas,monospace;padding:3px 7px;border:1px solid var(--line);border-radius:4px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}button,select{background:#252526;color:var(--text);border:1px solid #454545;padding:5px 8px;border-radius:3px;cursor:pointer}.editors{display:grid;grid-template-columns:1fr 1fr;min-height:350px}.pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}.pane:last-child{border-right:0}.head{height:32px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);background:#202020;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.pane textarea{flex:1;min-height:320px;border:0;resize:none;outline:0;background:var(--bg);color:var(--text);padding:12px;font:13px/1.55 Consolas,monospace}.bottom{border-top:1px solid var(--line);background:var(--panel)}.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent}.tabs button.active{background:#252526;color:white}.view{display:none;padding:10px;max-height:310px;overflow:auto;font:12px/1.5 Consolas,monospace;white-space:pre-wrap}.view.active{display:block}.stage{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:3px 0}.case{padding:5px 0;border-bottom:1px solid #252525}@media(max-width:700px){.editors{grid-template-columns:1fr}.pane{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="top">
  <strong>Semantic Projection POC 0.1</strong>
  <span id="standing" class="standing">runtime loading…</span>
  <div class="grow"></div>
  <select id="dialect"><option value="personal">Personal</option><option value="alien">Alien</option></select>
  <button id="reset">Reset</button>
  <button id="verify">Verify</button>
  <button id="defeat">Run defeat suite</button>
</div>
<div class="editors">
  <section class="pane"><div class="head">Personal projection — editable source</div><textarea id="personal" spellcheck="false"></textarea></section>
  <section class="pane"><div class="head">Python projection — editable target</div><textarea id="python" spellcheck="false"></textarea></section>
</div>
<div class="bottom">
  <div class="tabs">
    <button data-view="checks" class="active">Standing</button>
    <button data-view="ir">Canonical IR</button>
    <button data-view="reverse">Reconstructed IR</button>
    <button data-view="execution">Execution</button>
    <button data-view="tests">Defeat tests</button>
  </div>
  <div id="checks" class="view active"></div><div id="ir" class="view"></div><div id="reverse" class="view"></div><div id="execution" class="view"></div><div id="tests" class="view"></div>
</div>
<script type="module">
import {SAMPLE,parsePersonal,renderDialect,generatedPython,loadPython,verifyProjection,runDefeatSuite} from './semantic-core.js';
const $=s=>document.querySelector(s);const personal=$('#personal'),python=$('#python'),standing=$('#standing');let pyodide=null;
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderResult(r){$('#ir').textContent=r.irA?JSON.stringify(r.irA,null,2):'';$('#reverse').textContent=r.irB?JSON.stringify(r.irB,null,2):'';$('#execution').textContent=JSON.stringify({reference:r.reference,target:r.target},null,2);$('#checks').innerHTML=r.stages.map(s=>`<div class="stage"><span class="${s.status==='pass'?'ok':s.status==='agreed-failure'?'warn':'bad'}">${s.status==='pass'?'✓':s.status==='agreed-failure'?'~':'✗'} S${s.level}</span><span>${escape(s.detail)}</span></div>`).join('');const s4=r.stages.find(s=>s.level===4);if(s4?.status==='pass'){standing.textContent='S4 ✓';standing.className='standing ok'}else if(s4?.status==='agreed-failure'){standing.textContent='S3 ✓ · S4 agreed failure';standing.className='standing warn'}else{standing.textContent=r.highest>=0?`S${r.highest} earned`:'S0 failed';standing.className='standing bad'}}
async function verify(){if(!pyodide)return;renderResult(await verifyProjection(pyodide,personal.value,python.value))}
function reset(){personal.value=SAMPLE;python.value=generatedPython(SAMPLE);$('#dialect').value='personal'}
$('#verify').onclick=verify;$('#reset').onclick=()=>{reset();verify()};$('#dialect').onchange=()=>{try{const ir=parsePersonal(personal.value);personal.value=renderDialect(ir,$('#dialect').value);python.value=generatedPython(personal.value);verify()}catch{verify()}};$('#defeat').onclick=async()=>{if(!pyodide)return;$('#tests').textContent='running…';const suite=await runDefeatSuite(pyodide);$('#tests').innerHTML=`<div class="${suite.pass?'ok':'bad'}">${suite.pass?'✓':'✗'} defeat suite ${suite.pass?'passed':'failed'}</div>`+suite.cases.map(c=>`<div class="case"><span class="${c.pass?'ok':'bad'}">${c.pass?'✓':'✗'} ${escape(c.name)}</span> — expected ${escape(c.expectation)}</div>`).join('');document.querySelector('[data-view="tests"]').click()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});
reset();try{pyodide=await loadPython();await verify()}catch(e){standing.textContent='runtime unavailable';standing.className='standing bad';$('#checks').textContent='Pyodide could not load: '+e.message}
</script>
</body>
</html>
