<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Projection POC 0.1</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--panel:#181818;--line:#303030;--text:#d4d4d4;--muted:#8c8c8c;--ok:#4ec9b0;--bad:#f48771;--warn:#dcdcaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif}.top{display:flex;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.top strong{font-size:12px}.grow{flex:1}.standing{font:12px Consolas,monospace;padding:3px 7px;border:1px solid var(--line);border-radius:4px}.standing.ok{color:var(--ok);border-color:var(--ok)}.standing.bad{color:var(--bad);border-color:var(--bad)}button,select{background:#252526;color:var(--text);border:1px solid #454545;padding:5px 8px;border-radius:3px;cursor:pointer}.editors{display:grid;grid-template-columns:1fr 1fr;min-height:360px}.pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}.pane:last-child{border-right:0}.head{height:32px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);background:#202020;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.pane textarea{flex:1;min-height:330px;border:0;resize:none;outline:0;background:var(--bg);color:var(--text);padding:12px;font:13px/1.55 Consolas,monospace;tab-size:4}.bottom{border-top:1px solid var(--line);background:var(--panel)}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent}.tabs button.active{color:white;background:#252526}.view{display:none;padding:10px;max-height:300px;overflow:auto;font:12px/1.5 Consolas,monospace;white-space:pre-wrap}.view.active{display:block}.row{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:3px 0}.pass{color:var(--ok)}.fail{color:var(--bad)}.skip{color:var(--muted)}.note{color:var(--warn)}@media(max-width:700px){.editors{grid-template-columns:1fr}.pane{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="top">
  <strong>Semantic Projection POC 0.1</strong>
  <span id="standing" class="standing">S0 pending</span>
  <div class="grow"></div>
  <select id="dialect" title="Render the same admitted IR with another surface vocabulary">
    <option value="personal">Personal</option>
    <option value="alien">Alien</option>
  </select>
  <button id="reset">Reset</button>
  <button id="verify">Verify</button>
</div>
<div class="editors">
  <section class="pane">
    <div class="head">Personal projection — editable source</div>
    <textarea id="personal" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="head">Python projection — editable target</div>
    <textarea id="python" spellcheck="false"></textarea>
  </section>
</div>
<div class="bottom">
  <div class="tabs">
    <button data-view="checks" class="active">Standing</button>
    <button data-view="ir">Canonical IR</button>
    <button data-view="reverse">Reconstructed IR</button>
    <button data-view="execution">Execution</button>
  </div>
  <div id="checks" class="view active"></div>
  <div id="ir" class="view"></div>
  <div id="reverse" class="view"></div>
  <div id="execution" class="view"></div>
</div>
<script type="module">
const SAMPLE=`let total = 0
let values = [1, 3, 4, 5]

each x from values
    gather x into total

require total == 13
expose "Result" total`;
const $=s=>document.querySelector(s);
const personal=$('#personal'), python=$('#python'), standing=$('#standing');
let pyodide=null;
function node(kind,fields={}){return {kind,...fields}}
function lit(v){return node('Lit',{value:v})}
function ref(name){return node('Ref',{name})}
function parseValue(raw){raw=raw.trim();if(/^[-+]?\d+$/.test(raw))return lit(Number(raw));if(/^\[.*\]$/.test(raw)){let v;try{v=JSON.parse(raw)}catch{throw Error('invalid collection literal')};if(!Array.isArray(v)||v.some(x=>!Number.isInteger(x)))throw Error('Kernel 0.1 collections must contain integers');return lit(v)}if(/^[A-Za-z_]\w*$/.test(raw))return ref(raw);throw Error('unsupported expression: '+raw)}
function parsePersonal(text){const raw=text.replace(/\r/g,'').split('\n'),out=[];for(let i=0;i<raw.length;){const line=raw[i].trim();i++;if(!line||line.startsWith('#'))continue;let m;if((m=line.match(/^(?:let|nest)\s+([A-Za-z_]\w*)\s*=\s*(.+)$/))){out.push(node('Bind',{name:m[1],expr:parseValue(m[2])}));continue}if((m=line.match(/^(?:each|orbit)\s+([A-Za-z_]\w*)\s+(?:from|across)\s+([A-Za-z_]\w*)$/))){const body=[];while(i<raw.length&&(/^\s{4}\S/.test(raw[i])||/^\t\S/.test(raw[i]))){const b=raw[i].trim();i++;const u=b.match(/^(?:gather|meld)\s+([A-Za-z_]\w*)\s+(?:into|toward)\s+([A-Za-z_]\w*)$/);if(!u)throw Error('unsupported loop statement: '+b);body.push(node('AddUpdate',{target:u[2],value:ref(u[1])}))}if(!body.length)throw Error('iterate requires an indented body');out.push(node('Iterate',{binding:m[1],source:ref(m[2]),body}));continue}if((m=line.match(/^(?:require|verify)\s+([A-Za-z_]\w*)\s*==\s*(-?\d+)$/))){out.push(node('Assert',{condition:node('Eq',{left:ref(m[1]),right:lit(Number(m[2]))})}));continue}if((m=line.match(/^(?:expose|beam)\s+"([^"]+)"\s+([A-Za-z_]\w*)$/))){out.push(node('Observe',{label:m[1],value:ref(m[2])}));continue}throw Error('unsupported surface syntax: '+line)}return node('Program',{statements:out})}
function typeOf(v){if(Number.isInteger(v))return'Int';if(typeof v==='boolean')return'Bool';if(Array.isArray(v))return'Collection';return'Unknown'}
function validate(program){const types=new Map();function exprType(e,local=types){if(e.kind==='Lit')return typeOf(e.value);if(e.kind==='Ref'){if(!local.has(e.name))throw Error('UnboundReference('+e.name+')');return local.get(e.name)}if(e.kind==='Eq'){exprType(e.left,local);exprType(e.right,local);return'Bool'}throw Error('unsupported expression '+e.kind)}function walk(stmts,local=types){for(const s of stmts){if(s.kind==='Bind'){local.set(s.name,exprType(s.expr,local));continue}if(s.kind==='AddUpdate'){if(!local.has(s.target))throw Error('UnboundReference('+s.target+')');if(local.get(s.target)!=='Int'||exprType(s.value,local)!=='Int')throw Error('AddUpdate requires Int target and Int value');continue}if(s.kind==='Iterate'){if(exprType(s.source,local)!=='Collection')throw Error('Iterate source must be Collection');const nested=new Map(local);nested.set(s.binding,'Int');walk(s.body,nested);continue}if(s.kind==='Assert'){if(exprType(s.condition,local)!=='Bool')throw Error('Assert requires Bool');continue}if(s.kind==='Observe'){exprType(s.value,local);continue}throw Error('undeclared semantic operation '+s.kind)}}walk(program.statements);return true}
function evalExpr(e,store){if(e.kind==='Lit')return structuredClone(e.value);if(e.kind==='Ref'){if(!store.has(e.name))throw Error('UnboundReference('+e.name+')');return store.get(e.name)}if(e.kind==='Eq')return Object.is(evalExpr(e.left,store),evalExpr(e.right,store));throw Error('UnsupportedExpr('+e.kind+')')}
function execute(program){const store=new Map(),obs=[];function run(stmts){for(const s of stmts){if(s.kind==='Bind'){store.set(s.name,evalExpr(s.expr,store));continue}if(s.kind==='AddUpdate'){store.set(s.target,store.get(s.target)+evalExpr(s.value,store));continue}if(s.kind==='Iterate'){const coll=evalExpr(s.source,store),had=store.has(s.binding),old=store.get(s.binding);for(const v of coll){store.set(s.binding,v);run(s.body)}if(had)store.set(s.binding,old);else store.delete(s.binding);continue}if(s.kind==='Assert'){if(!evalExpr(s.condition,store))return {failure:'AssertionFailure'};continue}if(s.kind==='Observe'){obs.push([s.label,evalExpr(s.value,store)]);continue}}return null}const failure=run(program.statements);return {status:failure?'failure':'success',error:failure?.failure||null,store:Object.fromEntries(store),observations:obs}}
function exprPy(e){if(e.kind==='Lit')return JSON.stringify(e.value);if(e.kind==='Ref')return e.name;if(e.kind==='Eq')return `${exprPy(e.left)} == ${exprPy(e.right)}`;throw Error('cannot emit '+e.kind)}
function emitPython(program){const out=[];function emit(stmts,d=0){const p='    '.repeat(d);for(const s of stmts){if(s.kind==='Bind')out.push(`${p}${s.name} = ${exprPy(s.expr)}`);else if(s.kind==='Iterate'){out.push(`${p}for ${s.binding} in ${exprPy(s.source)}:`);emit(s.body,d+1)}else if(s.kind==='AddUpdate')out.push(`${p}${s.target} += ${exprPy(s.value)}`);else if(s.kind==='Assert')out.push(`${p}assert ${exprPy(s.condition)}`);else if(s.kind==='Observe')out.push(`${p}__observe__(${JSON.stringify(s.label)}, ${exprPy(s.value)})`)}}emit(program.statements);return out.join('\n')}
function canonical(x){if(Array.isArray(x))return x.map(canonical);if(x&&typeof x==='object'){const o={};for(const k of Object.keys(x).sort())o[k]=canonical(x[k]);return o}return x}
function normal(x){return JSON.stringify(canonical(x))}
function renderAlien(program){const lines=[];for(const s of program.statements){if(s.kind==='Bind')lines.push(`nest ${s.name} = ${exprPy(s.expr)}`);else if(s.kind==='Iterate'){lines.push(`orbit ${s.binding} across ${s.source.name}`);for(const b of s.body)lines.push(`    meld ${b.value.name} toward ${b.target}`)}else if(s.kind==='Assert')lines.push(`verify ${s.condition.left.name} == ${s.condition.right.value}`);else if(s.kind==='Observe')lines.push(`beam ${JSON.stringify(s.label)} ${s.value.name}`)}return lines.join('\n')}
async function reversePython(src){if(!pyodide)throw Error('CPython unavailable');pyodide.globals.set('__verify_src__',src);const raw=await pyodide.runPythonAsync(`import ast, json\nsrc=__verify_src__\ndef expr(n):\n    if isinstance(n,ast.Constant) and isinstance(n.value,(int,bool)): return {"kind":"Lit","value":n.value}\n    if isinstance(n,ast.List): return {"kind":"Lit","value":[e.value for e in n.elts if isinstance(e,ast.Constant) and isinstance(e.value,int)]}\n    if isinstance(n,ast.Name): return {"kind":"Ref","name":n.id}\n    if isinstance(n,ast.Compare) and len(n.ops)==1 and isinstance(n.ops[0],ast.Eq): return {"kind":"Eq","left":expr(n.left),"right":expr(n.comparators[0])}\n    raise ValueError("unsupported Python expression: "+type(n).__name__)\ndef stmt(n):\n    if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name): return {"kind":"Bind","name":n.targets[0].id,"expr":expr(n.value)}\n    if isinstance(n,ast.For) and isinstance(n.target,ast.Name): return {"kind":"Iterate","binding":n.target.id,"source":expr(n.iter),"body":[stmt(x) for x in n.body]}\n    if isinstance(n,ast.AugAssign) and isinstance(n.target,ast.Name):\n        if isinstance(n.op,ast.Add): return {"kind":"AddUpdate","target":n.target.id,"value":expr(n.value)}\n        if isinstance(n.op,ast.Mult): return {"kind":"MultiplyUpdate","target":n.target.id,"value":expr(n.value)}\n    if isinstance(n,ast.Assert): return {"kind":"Assert","condition":expr(n.test)}\n    if isinstance(n,ast.Expr) and isinstance(n.value,ast.Call) and isinstance(n.value.func,ast.Name) and n.value.func.id=="__observe__":\n        label=n.value.args[0]\n        if not isinstance(label,ast.Constant) or not isinstance(label.value,str): raise ValueError("observe label must be string")\n        return {"kind":"Observe","label":label.value,"value":expr(n.value.args[1])}\n    raise ValueError("unsupported Python statement: "+type(n).__name__)\ntree=ast.parse(src,mode="exec")\njson.dumps({"kind":"Program","statements":[stmt(n) for n in tree.body]},sort_keys=True)`);return JSON.parse(String(raw))}
async function executePython(src){pyodide.globals.set('__exec_src__',src);const raw=await pyodide.runPythonAsync(`import json\nobs=[]\ndef __observe__(label,value): obs.append([label,value])\nns={"__observe__":__observe__}; status="success"; err=None\ntry: exec(compile(__exec_src__,"<projection>","exec"),ns,ns)\nexcept AssertionError: status="failure"; err="AssertionFailure"\nexcept Exception as e: status="failure"; err=type(e).__name__\npublic={k:v for k,v in ns.items() if not k.startswith("__") and isinstance(v,(int,bool,list))}\njson.dumps({"status":status,"error":err,"store":public,"observations":obs},sort_keys=True)`);return JSON.parse(String(raw))}
function row(level,label,ok,msg=''){return `<div class="row"><span class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${level}</span><span>${label}${msg?' — '+msg:''}</span></div>`}
function firstDiff(a,b,path='IR'){if(typeof a!==typeof b)return `${path}: type differs`;if(a===null||b===null||typeof a!=='object')return a===b?'':`${path}: expected ${JSON.stringify(a)}, observed ${JSON.stringify(b)}`;for(const k of new Set([...Object.keys(a),...Object.keys(b)])){if(!(k in a))return `${path}.${k}: unexpected`;if(!(k in b))return `${path}.${k}: missing`;const d=firstDiff(a[k],b[k],`${path}.${k}`);if(d)return d}return''}
async function verify(regen=false){let rows='',irA,irB,refExec,pyExec,earned=-1;try{irA=parsePersonal(personal.value);earned=0;rows+=row('S0','surface elaborated',true);$('#ir').textContent=JSON.stringify(irA,null,2)}catch(e){rows+=row('S0','surface elaboration',false,e.message);return finish()}try{validate(irA);earned=1;rows+=row('S1','Kernel 0.1 admitted',true)}catch(e){rows+=row('S1','kernel admission',false,e.message);return finish()}refExec=execute(irA);if(regen||!python.value.trim())python.value=emitPython(irA);try{irB=await reversePython(python.value);earned=2;rows+=row('S2','real CPython ast.parse accepted target',true);$('#reverse').textContent=JSON.stringify(irB,null,2)}catch(e){rows+=row('S2','target syntax / supported subset',false,e.message);return finish()}if(normal(irA)===normal(irB)){earned=3;rows+=row('S3','independent reconstruction equals canonical IR',true)}else{rows+=row('S3','semantic identity',false,firstDiff(irA,irB));return finish()}pyExec=await executePython(python.value);if(refExec.status===pyExec.status&&refExec.error===pyExec.error&&normal(refExec.observations)===normal(pyExec.observations)){earned=4;rows+=row('S4','declared observations and failure class agree',true)}else rows+=row('S4','observational agreement',false);finish();function finish(){$('#checks').innerHTML=rows;$('#execution').textContent=JSON.stringify({reference:refExec||null,target:pyExec||null},null,2);standing.textContent=earned===4?'S4 ✓':(earned>=0?`S${earned} earned`:'S0 failed');standing.className='standing '+(earned===4?'ok':'bad')}}
$('#verify').onclick=()=>verify(false);$('#reset').onclick=()=>{personal.value=SAMPLE;python.value=emitPython(parsePersonal(SAMPLE));$('#dialect').value='personal';verify(false)};$('#dialect').onchange=()=>{try{const ir=parsePersonal(personal.value);personal.value=$('#dialect').value==='alien'?renderAlien(ir):SAMPLE;verify(true)}catch{verify(false)}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});personal.value=SAMPLE;python.value=emitPython(parsePersonal(SAMPLE));
try{const mod=await import('https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs');pyodide=await mod.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/'});await verify(false)}catch(e){standing.textContent='Python runtime unavailable';standing.classList.add('bad');$('#checks').textContent='Pyodide could not load: '+e.message}
</script>
</body>
</html>
